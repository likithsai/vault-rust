name: IronVault Build & Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: ironvault-macos
            binary_path: target/release/rust_vault
          - os: ubuntu-latest
            artifact_name: ironvault-linux
            binary_path: target/release/rust_vault
          - os: windows-latest
            artifact_name: ironvault-windows
            binary_path: target/release/rust_vault.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --- 1. macOS GTK4 Dependencies ---
      - name: Install GTK4 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gtk4 pkg-config

      # --- 2. Linux GTK4 Dependencies ---
      - name: Install GTK4 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev build-essential pkg-config libssl-dev

      # --- 3. Windows MSYS2 & GTK4 Setup ---
      - name: Set up MSYS2 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Add MSYS2 toolchain to Windows PATH
        if: runner.os == 'Windows'
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --- 4. Build Release Binary ---
      - name: Compile Release Binary
        run: cargo build --release

      # --- 5. Upload Build Artifact ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error