[package]
name = "rust_vault"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9"
relm4 = "0.9"
uuid = { version = "1.10", features = ["v4"] }
tokio = { version = "1.40", features = ["full"] }
zstd = "0.13"
blake3 = "1.5"
open = "5.3"

[dependencies.rusqlite]
version = "0.32"
features = ["bundled-sqlcipher-vendored-openssl", "uuid"]