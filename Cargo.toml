[package]
name = "rust_vault"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9"
relm4 = "0.9"
uuid = { version = "1.10", features = ["v4"] }
tokio = { version = "1.40", features = ["full"] }
zstd = "0.13"
blake3 = "1.5"
open = "5.3"

[package.metadata.bundle]
name = "Vault Video Optimizer"
identifier = "com.vault.video_optimizer"
icon = ["32x32.png", "128x128.png", "128x128@2x.png"]
version = "0.1.0"
copyright = "2026 Vault Studio"
category = "Video"
short_description = "Hardware-accelerated video batch optimizer"
long_description = "High-throughput parallel video compressor using hardware acceleration (VideoToolbox, NVENC, QSV)."

[dependencies.rusqlite]
version = "0.32"
features = ["bundled-sqlcipher-vendored-openssl", "uuid"]

[package.metadata.deb]
name = "ironvault"
maintainer = "likithsai <likithsai@example.com>"
copyright = "2026, likithsai"
license-file = ["LICENSE", "4"]
extended-description = "IronVault Pro Secure Encrypted Archive Utility"
depends = "$auto, libgtk-4-1"
section = "utils"
priority = "optional"
assets = [
    ["target/release/rust_vault", "usr/bin/ironvault", "755"],
]