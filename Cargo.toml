[package]
name = "rust_vault"
version = "0.1.0"
edition = "2021"
description = "IronVault Pro Secure Encrypted Archive Utility"
license = "MIT"

[dependencies]
gtk4 = "0.9"
relm4 = "0.9"
uuid = { version = "1.10", features = ["v4"] }
tokio = { version = "1.40", features = ["full"] }
zstd = "0.13"
blake3 = "1.5"
open = "5.3"

[dependencies.rusqlite]
version = "0.32"
features = ["bundled-sqlcipher", "uuid"]

[package.metadata.bundle]
name = "IronVault"
identifier = "com.ironvault.desktop"
icon = ["32x32.png", "128x128.png", "128x128@2x.png"]
version = "0.1.0"
copyright = "2026 IronVault Contributors"
category = "Utility"
short_description = "Encrypted archive utility"
long_description = "IronVault Pro Secure Encrypted Archive Utility with Zstd and SQLCipher."

[package.metadata.deb]
name = "ironvault"
maintainer = "likithsai <likithsai@example.com>"
copyright = "2026, likithsai"
license-file = ["LICENSE", "4"]
extended-description = "IronVault Pro Secure Encrypted Archive Utility"
depends = "$auto, libgtk-4-1"
section = "utils"
priority = "optional"
assets = [
    ["target/release/rust_vault", "usr/bin/ironvault", "755"],
]