name: IronVault Build & Package Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: ironvault-macos
            package_path: IronVault-macOS.dmg
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            artifact_name: ironvault-linux
            package_path: target/debian/*.deb
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: ironvault-windows
            package_path: IronVault-Windows.zip
            target: x86_64-pc-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Install Rust Toolchain with target ---
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------------------------
      # 1. macOS Build & Packaging
      # ------------------------------------------------------------------------
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gtk4 pkg-config create-dmg

      - name: Build Release Binary on macOS
        if: runner.os == 'macOS'
        run: cargo build --release

      - name: Create macOS .dmg Installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_root
          cp target/release/rust_vault dmg_root/IronVault
          chmod +x dmg_root/IronVault
          create-dmg \
            --volname "IronVault Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "IronVault-macOS.dmg" \
            "dmg_root/" || true

      # ------------------------------------------------------------------------
      # 2. Linux Build & Packaging
      # ------------------------------------------------------------------------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev build-essential pkg-config libssl-dev libvulkan-dev

      - name: Install pre-built cargo-deb
        if: runner.os == 'Linux'
        run: |
          curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | sudo tar -xvz -C /usr/local/bin
          cargo-binstall --no-confirm cargo-deb

      - name: Build and Package .deb on Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cargo deb --no-build

      # ------------------------------------------------------------------------
      # 3. Windows Build & Packaging (MSYS2 + GNU toolchain)
      # ------------------------------------------------------------------------
      - name: Set up MSYS2 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build Release Binary on Windows (GNU Target)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. Prepend MSYS2 MinGW/UCRT binaries and pkg-config to PATH
          $env:PATH = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;" + $env:PATH
          $env:PKG_CONFIG_PATH = "C:\msys64\ucrt64\lib\pkgconfig"

          # 2. Tell the GNU linker where to find gcc/ld
          $env:CC = "C:\msys64\ucrt64\bin\gcc.exe"
          $env:AR = "C:\msys64\ucrt64\bin\ar.exe"

          # 3. Verify cargo is detected
          cargo --version

          # 4. Build with the GNU target
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path win_dist | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/rust_vault.exe win_dist/IronVault.exe
          Copy-Item C:\msys64\ucrt64\bin\*.dll win_dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path win_dist/* -DestinationPath IronVault-Windows.zip -Force

      # ------------------------------------------------------------------------
      # 4. Upload Installer Artifacts
      # ------------------------------------------------------------------------
      - name: Upload Installer Packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # 5. Publish GitHub Release
  # ----------------------------------------------------------------------------
  publish-release:
    name: Create GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare release files
        run: |
          mkdir -p dist
          find release_assets/ -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}